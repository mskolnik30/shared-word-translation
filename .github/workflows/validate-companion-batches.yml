name: Validate companion batches

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit every TSW Study Companion batch
        run: python3 tools/audit_all_companion_batches.py
      - name: Audit complete canonical coverage
        run: python3 tools/audit_tsw_study_coverage.py
