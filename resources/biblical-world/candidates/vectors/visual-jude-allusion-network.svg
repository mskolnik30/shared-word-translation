<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Earlier stories and writings echoed in Jude</title>
  <desc id="desc">Earlier stories and writings echoed in Jude. Reader guide with four points: Exodus, rebellious angels, and Sodom; A later Jewish story connects Michael and Moses; Cain, Balaam, and Korah; Jude quotes 1 Enoch. Keep in view: The story about Michael and Moses and the quotation from 1 Enoch come from different ancient traditions. They should not be blended together.</desc>
  <rect width="1200" height="800" fill="#F7F2E8"/>
  <style>text { font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }</style>
  <rect x="40" y="36" width="1120" height="728" rx="30" fill="#FFFDFC"/>
