  <title id="title">2 Peter 3:10: why translations differ</title>
  <desc id="desc">2 Peter 3:10: why translations differ. Reader guide with four points: The day arrives unexpectedly; Some ancient copies support &#x27;will be found&#x27; or &#x27;will be exposed&#x27;; Other copies support destruction or burning language; The chapter moves toward new heavens and a new earth. Keep in view: Ancient copies differ at this point. This guide summarizes the main readings; a specialist should verify the individual manuscripts.</desc>
