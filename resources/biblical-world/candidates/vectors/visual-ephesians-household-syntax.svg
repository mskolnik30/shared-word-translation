<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Ephesians 5:21–6:9: sequence and debated syntax</title>
  <desc id="desc">Ephesians 5:21–6:9: sequence and debated syntax. Four-part interpretive diagram. 5:21 calls for mutual submission; Wives and husbands; Children and fathers; Enslaved people and masters. Caution: Verse 5:21 immediately precedes the household speech; its grammatical relation and scope are debated.</desc>
