<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Jericho, Bethel, and Ai</title>
  <desc id="desc">Jericho, Bethel, and Ai. Geographic orientation map with land, water, coastlines, rivers, and these places: Jericho / Tell es-Sultan, known location; Bethel (common identification), probable location; Ai / et-Tell proposal, location debated. No route is drawn because scholars still debate the locations of Bethel and Ai and the course of the campaign.</desc>
