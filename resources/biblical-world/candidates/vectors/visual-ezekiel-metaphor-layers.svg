<text x="635" y="382" font-size="21" font-weight="650" fill="#26333B" text-anchor="start"><tspan x="635" dy="0">Judgment is</tspan><tspan x="635" dy="27">narrated through</tspan><tspan x="635" dy="27">graphic violence</tspan></text>
