<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Ezekiel&#x27;s city-wife metaphors: layered reading</title>
  <desc id="desc">Ezekiel&#x27;s city-wife metaphors: layered reading. Four-part interpretive diagram. Cities are personified as women; Political alliances become sexual metaphor; Judgment is narrated through graphic violence; Readers must distinguish rhetoric from an ethical model. Caution: The imagery can retraumatize; it must never legitimate sexual or domestic violence.</desc>
  <rect width="1200" height="800" fill="#F7F2E8"/>
  <style>text { font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }</style>
