<text x="109" y="382" font-size="21" font-weight="650" fill="#26333B" text-anchor="start"><tspan x="109" dy="0">Cities are</tspan><tspan x="109" dy="27">personified as</tspan><tspan x="109" dy="27">women</tspan></text>
