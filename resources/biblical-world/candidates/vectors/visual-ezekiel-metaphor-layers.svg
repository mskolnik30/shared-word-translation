<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">How Ezekiel uses women to portray cities</title>
  <desc id="desc">How Ezekiel uses women to portray cities. Reader guide with four points: Cities are portrayed as women; Political alliances are described through sexual imagery; Judgment is described through graphic violence; This language is not a model for how people should speak or act. Keep in view: The imagery can reopen trauma. It must never be used to excuse sexual or domestic violence.</desc>
  <rect width="1200" height="800" fill="#F7F2E8"/>
  <style>text { font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }</style>
  <rect x="40" y="36" width="1120" height="728" rx="30" fill="#FFFDFC"/>
<text x="80" y="78" font-size="15" font-weight="800" fill="#A6533F" text-anchor="start"><tspan x="80" dy="0">READING GUIDE</tspan></text>
<text x="80" y="124" font-size="35" font-weight="760" fill="#19354D" text-anchor="start"><tspan x="80" dy="0">How Ezekiel uses women to portray cities</tspan></text>
<text x="80" y="154" font-size="18" font-weight="400" fill="#5D6B72" text-anchor="start"><tspan x="80" dy="0">Bible passages  Ezekiel 16 · Ezekiel 23</tspan></text>
<circle cx="108" cy="273" r="27" fill="#2B7773"/>
<text x="108" y="281" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="108" dy="0">1</tspan></text>
<text x="156" y="262" font-size="22" font-weight="650" fill="#26333B" text-anchor="start"><tspan x="156" dy="0">Cities are portrayed as women</tspan></text>
<line x1="156" y1="356" x2="580" y2="356" stroke="#CAD5D2" stroke-width="2"/>
<circle cx="648" cy="273" r="27" fill="#A6533F"/>
<text x="648" y="281" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="648" dy="0">2</tspan></text>
<text x="696" y="262" font-size="22" font-weight="650" fill="#26333B" text-anchor="start"><tspan x="696" dy="0">Political alliances are described</tspan><tspan x="696" dy="29">through sexual imagery</tspan></text>
<line x1="696" y1="356" x2="1120" y2="356" stroke="#CAD5D2" stroke-width="2"/>
<circle cx="108" cy="423" r="27" fill="#2B7773"/>
<text x="108" y="431" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="108" dy="0">3</tspan></text>
<text x="156" y="412" font-size="22" font-weight="650" fill="#26333B" text-anchor="start"><tspan x="156" dy="0">Judgment is described through</tspan><tspan x="156" dy="29">graphic violence</tspan></text>
<line x1="156" y1="506" x2="580" y2="506" stroke="#CAD5D2" stroke-width="2"/>
<circle cx="648" cy="423" r="27" fill="#A6533F"/>
<text x="648" y="431" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="648" dy="0">4</tspan></text>
<text x="696" y="412" font-size="22" font-weight="650" fill="#26333B" text-anchor="start"><tspan x="696" dy="0">This language is not a model for</tspan><tspan x="696" dy="29">how people should speak or act</tspan></text>
<line x1="696" y1="506" x2="1120" y2="506" stroke="#CAD5D2" stroke-width="2"/>
<rect x="80" y="558" width="1040" height="118" rx="18" fill="#E8F1EF"/>
<text x="108" y="594" font-size="15" font-weight="800" fill="#2B7773" text-anchor="start"><tspan x="108" dy="0">KEEP IN VIEW</tspan></text>
<text x="108" y="629" font-size="19" font-weight="400" fill="#26333B" text-anchor="start"><tspan x="108" dy="0">The imagery can reopen trauma. It must never be used to excuse sexual or domestic violence.</tspan></text>
<text x="80" y="739" font-size="15" font-weight="650" fill="#5D6B72" text-anchor="start"><tspan x="80" dy="0">Church Commons · Fluent Companion</tspan></text>
