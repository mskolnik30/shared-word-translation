<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">1 Corinthians 6:9: disputed Greek terms</title>
  <desc id="desc">1 Corinthians 6:9: disputed Greek terms. Reader guide with four points: malakoi literally means &#x27;soft&#x27; and was used in several ways; arsenokoitai is rare, and its exact meaning is disputed; English translations have used different labels over time; Modern identity labels are not direct one-word matches. Keep in view: This overview of the words does not erase moral debate or suggest that all scholars agree.</desc>
  <rect width="1200" height="800" fill="#F7F2E8"/>
  <style>text { font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }</style>
  <rect x="40" y="36" width="1120" height="728" rx="30" fill="#FFFDFC"/>
