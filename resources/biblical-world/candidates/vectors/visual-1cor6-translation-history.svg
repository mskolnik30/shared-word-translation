<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">1 Corinthians 6:9: disputed Greek terms</title>
  <desc id="desc">1 Corinthians 6:9: disputed Greek terms. Four-part interpretive diagram. malakoi has a broad history of meanings; arsenokoitai is rare and disputed; English labels have shifted across translation history; Modern identity terms are not automatic lexical equivalents. Caution: A lexical-history schematic; it does not erase moral debate or claim scholarly unanimity.</desc>
