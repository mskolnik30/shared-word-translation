<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Martha, Mary, and Jesus: the narrated exchange</title>
  <desc id="desc">Martha, Mary, and Jesus: the narrated exchange. Four-part interpretive diagram. Martha welcomes Jesus; Mary listens at Jesus&#x27; feet; Martha voices her burden; Jesus answers Martha directly. Caution: Relational schematic only. The house, furniture, meal, and seating are not described.</desc>
