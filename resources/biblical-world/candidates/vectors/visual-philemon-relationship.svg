<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Philemon: appeal inside a slaveholding world</title>
  <desc id="desc">Philemon: appeal inside a slaveholding world. Reader guide with four points: The letter&#x27;s sender appeals rather than commands; Onesimus is called a beloved brother; Philemon holds social and legal power; The letter does not tell us what happened next. Keep in view: The appeal challenges the relationship, but the letter does not call for the end of Roman slavery.</desc>
