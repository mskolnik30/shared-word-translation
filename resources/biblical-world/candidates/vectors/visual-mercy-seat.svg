<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Ark and cover: textual relationships</title>
  <desc id="desc">Ark and cover: textual relationships. Four-part interpretive diagram. Ark described in Exodus; Cover and cherubim described above it; Cloud and atonement ritual in Leviticus 16; No surviving ark confirms appearance. Caution: Schematic only; dimensions and relationships follow the texts, while visual details remain unknown.</desc>
