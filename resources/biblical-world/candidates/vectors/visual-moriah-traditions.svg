<text x="80" y="124" font-size="35" font-weight="760" fill="#19354D" text-anchor="start"><tspan x="80" dy="0">Moriah: what Genesis says and Chronicles later</tspan><tspan x="80" dy="44">connects</tspan></text>
<text x="80" y="198" font-size="18" font-weight="400" fill="#5D6B72" text-anchor="start"><tspan x="80" dy="0">Bible passages  Genesis 22:2 · 2 Chronicles 3:1</tspan></text>
<circle cx="108" cy="281" r="27" fill="#2B7773"/>
<text x="108" y="289" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="108" dy="0">1</tspan></text>
<text x="156" y="270" font-size="22" font-weight="650" fill="#26333B" text-anchor="start"><tspan x="156" dy="0">Genesis names the land of Moriah</tspan></text>
<line x1="156" y1="364" x2="580" y2="364" stroke="#CAD5D2" stroke-width="2"/>
<circle cx="648" cy="281" r="27" fill="#A6533F"/>
<text x="648" y="289" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="648" dy="0">2</tspan></text>
<text x="696" y="270" font-size="22" font-weight="650" fill="#26333B" text-anchor="start"><tspan x="696" dy="0">Chronicles names Mount Moriah as</tspan><tspan x="696" dy="29">the temple site</tspan></text>
<line x1="696" y1="364" x2="1120" y2="364" stroke="#CAD5D2" stroke-width="2"/>
<circle cx="108" cy="431" r="27" fill="#2B7773"/>
<text x="108" y="439" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="108" dy="0">3</tspan></text>
<text x="156" y="420" font-size="22" font-weight="650" fill="#26333B" text-anchor="start"><tspan x="156" dy="0">The exact Genesis location remains</tspan><tspan x="156" dy="29">disputed</tspan></text>
<line x1="156" y1="514" x2="580" y2="514" stroke="#CAD5D2" stroke-width="2"/>
<rect x="80" y="566" width="1040" height="118" rx="18" fill="#E8F1EF"/>
<text x="108" y="602" font-size="15" font-weight="800" fill="#2B7773" text-anchor="start"><tspan x="108" dy="0">KEEP IN VIEW</tspan></text>
<text x="108" y="637" font-size="19" font-weight="400" fill="#26333B" text-anchor="start"><tspan x="108" dy="0">Genesis and Chronicles make different statements about Moriah. This guide does not claim that</tspan><tspan x="108" dy="25">its exact modern location is known.</tspan></text>
