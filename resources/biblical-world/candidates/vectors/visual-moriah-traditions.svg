<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Moriah: text and later identification</title>
  <desc id="desc">Moriah: text and later identification. Four-part interpretive diagram. Genesis names the land of Moriah; Chronicles names Mount Moriah as the temple site; The exact Genesis location remains disputed. Caution: This is an evidence-and-tradition diagram, not a claim that one modern point is certain.</desc>
  <rect width="1200" height="800" fill="#F7F2E8"/>
  <style>text { font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }</style>
  <rect x="48" y="44" width="1104" height="712" rx="32" fill="#FFFDFC" stroke="#CAD5D2" stroke-width="3"/>
<text x="96" y="112" font-size="38" font-weight="750" fill="#19354D" text-anchor="start"><tspan x="96" dy="0">Moriah: text and later identification</tspan></text>
<text x="96" y="186" font-size="20" font-weight="400" fill="#5D6B72" text-anchor="start"><tspan x="96" dy="0">Primary texts: Genesis 22:2; 2 Chronicles 3:1</tspan></text>
<rect x="223" y="260" width="228" height="224" rx="22" fill="#DDECEE" stroke="#CAD5D2" stroke-width="2"/>
<circle cx="337" cy="304" r="22" fill="#19354D"/>
<text x="337" y="312" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="337" dy="0">1</tspan></text>
<text x="241" y="348" font-size="21" font-weight="650" fill="#26333B" text-anchor="start"><tspan x="241" dy="0">Genesis names the</tspan><tspan x="241" dy="27">land of Moriah</tspan></text>
<path d="M 459 364 L 476 364" stroke="#2B7773" stroke-width="5" stroke-linecap="round"/>
<path d="M 464 352 L 476 364 L 464 376" fill="none" stroke="#2B7773" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="486" y="260" width="228" height="224" rx="22" fill="#F2E4DA" stroke="#CAD5D2" stroke-width="2"/>
<circle cx="600" cy="304" r="22" fill="#19354D"/>
<text x="600" y="312" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="600" dy="0">2</tspan></text>
<text x="504" y="348" font-size="21" font-weight="650" fill="#26333B" text-anchor="start"><tspan x="504" dy="0">Chronicles names</tspan><tspan x="504" dy="27">Mount Moriah as</tspan><tspan x="504" dy="27">the temple site</tspan></text>
<path d="M 722 364 L 739 364" stroke="#2B7773" stroke-width="5" stroke-linecap="round"/>
<path d="M 727 352 L 739 364 L 727 376" fill="none" stroke="#2B7773" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="749" y="260" width="228" height="224" rx="22" fill="#DDECEE" stroke="#CAD5D2" stroke-width="2"/>
<circle cx="863" cy="304" r="22" fill="#19354D"/>
<text x="863" y="312" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="863" dy="0">3</tspan></text>
<text x="767" y="348" font-size="21" font-weight="650" fill="#26333B" text-anchor="start"><tspan x="767" dy="0">The exact Genesis</tspan><tspan x="767" dy="27">location remains</tspan><tspan x="767" dy="27">disputed</tspan></text>
<rect x="96" y="560" width="1008" height="122" rx="20" fill="#FFF6E8" stroke="#C49347" stroke-width="2"/>
<text x="126" y="598" font-size="21" font-weight="750" fill="#A6533F" text-anchor="start"><tspan x="126" dy="0">Reading caution</tspan></text>
<text x="126" y="635" font-size="20" font-weight="400" fill="#26333B" text-anchor="start"><tspan x="126" dy="0">This is an evidence-and-tradition diagram, not a claim that one modern point is certain.</tspan></text>
<text x="96" y="724" font-size="18" font-weight="700" fill="#5D6B72" text-anchor="start"><tspan x="96" dy="0">UNPUBLISHED CANDIDATE • HUMAN SCHOLARLY REVIEW REQUIRED</tspan></text>
</svg>
