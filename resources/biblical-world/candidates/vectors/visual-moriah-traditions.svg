<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Moriah: what Genesis says and Chronicles later connects</title>
  <desc id="desc">Moriah: what Genesis says and Chronicles later connects. Reader guide with four points: Genesis names the land of Moriah; Chronicles names Mount Moriah as the temple site; The exact Genesis location remains disputed. Keep in view: Genesis and Chronicles make different statements about Moriah. This guide does not claim that its exact modern location is known.</desc>
  <rect width="1200" height="800" fill="#F7F2E8"/>
  <style>text { font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }</style>
  <rect x="40" y="36" width="1120" height="728" rx="30" fill="#FFFDFC"/>
