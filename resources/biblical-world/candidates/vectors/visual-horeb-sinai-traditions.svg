  <title id="title">Horeb / Sinai: a disputed location</title>
  <desc id="desc">Horeb / Sinai: a disputed location. Reader guide with four points: Exodus and Deuteronomy use both names; Travel details show broad relationships; Several modern locations have been proposed; No proposal is conclusive. Keep in view: No modern mountain is presented as established.</desc>
