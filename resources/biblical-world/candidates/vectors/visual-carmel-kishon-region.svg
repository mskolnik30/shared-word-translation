  <title id="title">Carmel, Kishon, and Jezreel</title>
  <desc id="desc">Carmel, Kishon, and Jezreel. Geographic orientation map with land, water, coastlines, rivers, and these places: Mount Carmel, approximate area; Kishon River, approximate area; Jezreel, probable location; Megiddo, known location. The mountain and river labels mark broad areas. Elijah&#x27;s exact path cannot be recovered.</desc>
