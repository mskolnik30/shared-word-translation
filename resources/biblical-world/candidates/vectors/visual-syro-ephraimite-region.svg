  <title id="title">The Syro-Ephraimite crisis</title>
  <desc id="desc">The Syro-Ephraimite crisis. Geographic orientation map with land, water, coastlines, rivers, and these places: Jerusalem, known location; Samaria, known location; Damascus, known location. This map locates the three capitals. Ancient borders and exact military routes are uncertain and are not shown.</desc>
