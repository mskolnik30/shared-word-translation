<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">What does the LORD require?</title>
  <desc id="desc">What does the LORD require?. Reader guide with four points: Do justice; Love faithful kindness; Walk humbly with your God; The answer comes within a scene like a courtroom, where God brings a charge against the people. Keep in view: These three phrases summarize 6:8 but do not replace the chapter&#x27;s full setting.</desc>
