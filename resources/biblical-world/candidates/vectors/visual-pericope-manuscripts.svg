<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">John 7:53–8:11 in the manuscript tradition</title>
  <desc id="desc">John 7:53–8:11 in the manuscript tradition. Four-part interpretive diagram. Absent from the earliest surviving Greek witnesses; Present in many later manuscripts; Placed at different locations in some witnesses; Printed with textual notes in modern editions. Caution: A simplified transmission diagram; manuscript dates and readings require textual-specialist review.</desc>
