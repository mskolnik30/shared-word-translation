  <title id="title">Leviticus 18 and 20: ancient laws and today&#x27;s questions</title>
  <desc id="desc">Leviticus 18 and 20: ancient laws and today&#x27;s questions. Reader guide with four points: Israel is called to holiness; Family, household, social standing, and land shape the laws; The prohibitions belong to an ancient social world; Readers disagree about how the laws apply today. Keep in view: The ancient categories do not match modern identities one-for-one.</desc>
