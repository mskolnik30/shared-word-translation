<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Debt and loss in Nehemiah 5</title>
  <desc id="desc">Debt and loss in Nehemiah 5. Reader guide with four points: Food shortage and taxation; Fields and houses mortgaged; Debt pushes children into servitude; Nehemiah demands restoration and an end to interest. Keep in view: The guide shows how debt traps families instead of treating the crisis as only a spiritual problem.</desc>
