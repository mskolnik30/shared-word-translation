<text x="635" y="348" font-size="21" font-weight="650" fill="#26333B" text-anchor="start"><tspan x="635" dy="0">Lo-Ammi signals</tspan><tspan x="635" dy="27">&#x27;not my people&#x27;</tspan></text>
