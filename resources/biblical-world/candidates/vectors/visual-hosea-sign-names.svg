<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Hosea&#x27;s sign-names and reversal</title>
  <desc id="desc">Hosea&#x27;s sign-names and reversal. Four-part interpretive diagram. Jezreel names remembered bloodshed; Lo-Ruhamah signals &#x27;no compassion&#x27;; Lo-Ammi signals &#x27;not my people&#x27;; The poetry later reverses rejection toward mercy and belonging. Caution: The children&#x27;s symbolic use and the marriage metaphor require explicit harm-aware review.</desc>
  <rect width="1200" height="800" fill="#F7F2E8"/>
  <style>text { font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }</style>
  <rect x="48" y="44" width="1104" height="712" rx="32" fill="#FFFDFC" stroke="#CAD5D2" stroke-width="3"/>
