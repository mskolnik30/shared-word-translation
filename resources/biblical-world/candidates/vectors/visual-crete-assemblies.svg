<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Crete: representative urban centers</title>
  <desc id="desc">Crete: representative urban centers. Geographic orientation map with land, water, coastlines, rivers, and these places: Gortyna, known location; Knossos, known location; Crete, approximate area. Titus says elders should be appointed in every town but does not name those towns. Gortyna and Knossos provide geographic orientation.</desc>
