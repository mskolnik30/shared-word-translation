<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Haggai&#x27;s dated messages</title>
  <desc id="desc">Haggai&#x27;s dated messages. Reader guide with four points: Year 2, month 6, day 1: rebuild; Month 6, day 24: work begins; Month 7, day 21: encouragement; Month 9, day 24: messages about holiness and Zerubbabel. Keep in view: The dates given by the book are retained; their modern calendar equivalents vary slightly among scholars.</desc>
