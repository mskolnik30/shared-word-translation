<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Daniel 7: symbols within the vision</title>
  <desc id="desc">Daniel 7: symbols within the vision. Reader guide with four points: Four beasts rise from the sea; A boastful horn opposes the holy ones; The Ancient One sits in judgment; One like a human being receives authority. Keep in view: The chapter interprets beasts as kingdoms; later identifications remain debated.</desc>
