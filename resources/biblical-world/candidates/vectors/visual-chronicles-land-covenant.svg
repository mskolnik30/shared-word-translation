<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Temple prayer, land, exile, and return</title>
  <desc id="desc">Temple prayer, land, exile, and return. Reader guide with four points: Temple dedication and prayer; Warnings about covenant unfaithfulness; Destruction and exile; Return under Persian rule. Keep in view: This sequence follows the book&#x27;s message. It is not a formula for blaming communities for disaster.</desc>
