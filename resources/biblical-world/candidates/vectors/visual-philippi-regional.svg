  <title id="title">Philippi in Macedonia</title>
  <desc id="desc">Philippi in Macedonia. Geographic orientation map with land, water, coastlines, rivers, and these places: Philippi, known location; Neapolis (port), known location; Amphipolis, known location; Thessalonica, known location. This map shows where Philippi stood in relation to its port and nearby cities. Acts does not describe every part of the journey.</desc>
