<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">3 John: hospitality and contested authority</title>
  <desc id="desc">3 John: hospitality and contested authority. Four-part interpretive diagram. The elder writes; Gaius supports traveling coworkers; Diotrephes rejects the elder and expels others; Demetrius receives commendation. Caution: The network shows competing authority claims, not a complete church organization chart.</desc>
