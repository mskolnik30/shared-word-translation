<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Royal power: David sends and takes</title>
  <desc id="desc">Royal power: David sends and takes. Reader guide with four points: David sends for information; David sends messengers and takes Bathsheba; David sends orders concerning Uriah; The prophet later exposes the abuse of power. Keep in view: The guide keeps David&#x27;s use of royal power in view and does not romanticize coercion.</desc>
