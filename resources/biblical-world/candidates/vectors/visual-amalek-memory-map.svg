<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Amalek in Israel&#x27;s memory</title>
  <desc id="desc">Amalek in Israel&#x27;s memory. Reader guide with four points: Exodus remembers an attack; Deuteronomy turns the memory into a command; Samuel tells of royal violence; Esther calls Haman an Agagite, recalling this older conflict. Keep in view: This guide follows how later biblical books remember Amalek. It does not make a geographic claim or justify violence today.</desc>
