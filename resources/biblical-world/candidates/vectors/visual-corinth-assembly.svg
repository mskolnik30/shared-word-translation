<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">The church in Corinth: voices and order</title>
  <desc id="desc">The church in Corinth: voices and order. Reader guide with four points: A gathered church with unequal social standing; Many gifts and speaking roles; Speech should build up the church and be understood; The community weighs what is said and participates in order. Keep in view: The Bible does not describe the room, table, seating plan, or individual appearances, so none is shown as if known.</desc>
