<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Faith shown in action</title>
  <desc id="desc">Faith shown in action. Reader guide with four points: A claim to faith; A neighbor lacks food or clothing; Words without material care do not help; Living faith becomes visible in action. Keep in view: This guide follows James&#x27;s argument without reducing salvation to a scorecard.</desc>
  <rect width="1200" height="800" fill="#F7F2E8"/>
  <style>text { font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }</style>
  <rect x="40" y="36" width="1120" height="728" rx="30" fill="#FFFDFC"/>
